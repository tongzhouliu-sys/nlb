name = "nlb-trigger"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cloudflare Cron Trigger 固定按 UTC 解析。
# "56 3 * * *" = UTC 03:56 = SGT 11:56：装环境约 3–4 分钟后，抢座动作正好落在 12:00。
#   · 想让「触发」本身 = 12:00（抢座 ≈12:04，仍 <12:30）→ 改成 "0 4 * * *"
#   · 想更保险（提前 6 分钟）→ 改成 "54 3 * * *"
[triggers]
crons = ["56 3 * * *"]
