name: NLB Seat Auto-Booking

on:
  # 提前到 UTC 03:35（= 11:35 SGT）触发。
  # 原因：GitHub Actions 定时任务常有 3–15 分钟排队延迟，且装环境需 2–4 分钟。
  # 真正的预约动作由下方 "Wait until 12:00:00 SGT" 步骤精确卡点开始。
  schedule:
    - cron: "35 3 * * *"

  # Actions 页面手动触发（测试用，不等待卡点，立即执行）
  workflow_dispatch:
    inputs:
      date_offset:
        description: "预约哪天（0=今天, 1=明天, 默认1）"
        required: false
        default: "1"

jobs:
  book-seat:
    runs-on: ubuntu-latest
    # 等待卡点最长约 25 分钟 + 预约流程约 10 分钟，需放宽超时
    timeout-minutes: 45
    env:
      # 统一 Runner 日志时区为 SGT，避免日志前缀（原为 UTC）与程序内
      # datetime.now(SGT) 打印的时间相差 8 小时造成误解。
      # 注：下方 "Wait until 12:00:00 SGT" 步骤中的 `date -u ...` 显式带 -u，
      # 按 UTC 解析/输出，不受此 TZ 影响，等待卡点计算逻辑不变。
      TZ: Asia/Singapore

    steps:
      # ── 1. 拉取代码 ───────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. 配置 Python ────────────────────────────────────────────
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. 安装依赖 ───────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      # ── 4. 定时触发时：精确等到 12:00:00 SGT（= 04:00:00 UTC）────
      #     新加坡无夏令时，固定 UTC+8，直接按 UTC 计算即可
      - name: ⏳ Wait until 12:00:00 SGT
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 04:00:00" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$(( TARGET - NOW ))
            echo "Sleeping ${WAIT}s until 12:00:00 SGT..."
            sleep "$WAIT"
          else
            echo "Trigger was late, already past 12:00 SGT, starting immediately."
          fi

      # ── 5. 执行预约脚本（一次运行内完成两个时段）──────────────────
      - name: 🪑 Run booking script
        env:
          NLB_USERNAME: ${{ secrets.NLB_USERNAME }}
          NLB_PASSWORD: ${{ secrets.NLB_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BOOKING_DATE_OFFSET: ${{ github.event.inputs.date_offset || '1' }}
        run: python book_seat.py

      # ── 6. 上传截图（失败时也上传，便于排查）──────────────────────
      - name: 📸 Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
