name: NLB Seat Auto-Booking

on:
  # UTC 04:00 = SGT 12:00 定时触发，触发即跑（无提前触发、无等待卡点）。
  # 注意：GitHub 内置 schedule 是"尽力而为"，实测可能被拖延数小时，
  #       不保证准点 12:00 —— 这是保持简单的取舍。
  schedule:
    - cron: "0 4 * * *"

  # Actions 页面手动触发（测试用，立即执行）
  workflow_dispatch:
    inputs:
      date_offset:
        description: "预约哪天（0=今天, 1=明天, 默认1）"
        required: false
        default: "1"

jobs:
  book-seat:
    runs-on: ubuntu-latest
    # 触发即跑，无等待步骤；装环境约 3–4 分钟 + 预约流程约 10 分钟
    timeout-minutes: 20
    env:
      # 统一 Runner 日志时区为 SGT，避免日志前缀（原为 UTC）与程序内
      # datetime.now(SGT) 打印的时间相差 8 小时造成误解。
      TZ: Asia/Singapore

    steps:
      # ── 1. 拉取代码 ───────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. 配置 Python ────────────────────────────────────────────
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. 安装依赖 ───────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      # ── 4. 执行预约脚本（一次运行内完成两个时段）──────────────────
      - name: 🪑 Run booking script
        env:
          NLB_USERNAME: ${{ secrets.NLB_USERNAME }}
          NLB_PASSWORD: ${{ secrets.NLB_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BOOKING_DATE_OFFSET: ${{ github.event.inputs.date_offset || '1' }}
        run: python book_seat.py

      # ── 5. 上传截图（失败时也上传，便于排查）──────────────────────
      - name: 📸 Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
